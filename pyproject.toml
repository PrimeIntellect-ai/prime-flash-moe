[build-system]
requires = [
  "setuptools",
  "wheel",
  "build",
  "ninja",
  "torch",
]
build-backend = "setuptools.build_meta"

[project]
name = "prime_moe"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "torch"
]

[project.optional-dependencies]
dev = [
  "ruff",
  "matplotlib"
]

[tool.ruff]
line-length = 150
exclude = [
    ".venv",
    "docs",
    "extern",
    "test",
    "tools",
    "fuzzer",
    "cmake",
    "bin",
]

[tool.ruff.lint]
ignore = ["F403"]
select = [
    "ANN",
    "UP"
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"setup.py" = ["ANN"]
