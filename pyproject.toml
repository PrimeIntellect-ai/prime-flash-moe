[build-system]
requires = [
  "setuptools",
  "wheel",
  "build",
  "numpy",
  "ninja",
  "torch",
  "torchvision",
  "pytorch-triton",
]
build-backend = "setuptools.build_meta"

[project]
name = "prime_moe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "setuptools",
  "numpy",
  "torch",
  "torchvision",
  "pytorch-triton",
  "sglang>=0.5.2",
]

[tool.uv.sources]
torch = { index = "pytorch-nightly-cu130" }
torchvision = { index = "pytorch-nightly-cu130" }
pytorch-triton = { index = "pytorch-nightly-cu130" }

[[tool.uv.index]]
name = "pytorch-nightly-cu130"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true
