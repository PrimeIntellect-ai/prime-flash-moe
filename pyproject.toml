[build-system]
requires = [
  "setuptools",
  "wheel",
  "build",
  "ninja",
  "torch",
]
build-backend = "setuptools.build_meta"

[project]
name = "prime_moe"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "torch"
]

[project.optional-dependencies]
dev = [
  "ruff",
  "matplotlib"
]

[tool.uv]
# prime_moe's CUDAExtension links against the torch that is present at build time.
# uv's default isolated build env resolves its own "torch" (per build-system.requires)
# instead of reusing the project's installed torch, which can pull a different build
# and break the ABI the compiled _C.so expects at import time. Force it to reuse the
# already-installed interpreter env instead.
no-build-isolation-package = ["prime_moe"]

[tool.ruff]
line-length = 150
exclude = [
    ".venv",
    "docs",
    "extern",
    "test",
    "tools",
    "fuzzer",
    "cmake",
    "bin",
]

[tool.ruff.lint]
ignore = ["F403"]
select = [
    "ANN",
    "UP"
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"setup.py" = ["ANN"]
