[build-system]
requires = [
    "setuptools",
    "wheel",
    "build",
    "numpy",
    "ninja",
    "torch>=2.5",
    "torchvision>=0.20",
]
build-backend = "setuptools.build_meta"

[project]
name = "prime_moe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "setuptools",
    "torch",
    "numpy",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
